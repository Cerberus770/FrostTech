    <rect x="95" y="210" width="10" height="10" rx="1"/>
    <rect x="115" y="210" width="10" height="10" rx="1"/>
    <rect x="135" y="210" width="10" height="10" rx="1"/>
    <rect x="165" y="210" width="10" height="10" rx="1"/>
    <rect x="185" y="210" width="10" height="10" rx="1"/>
