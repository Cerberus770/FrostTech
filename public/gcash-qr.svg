    <rect x="175" y="240" width="10" height="10" rx="1"/>
    <rect x="225" y="240" width="10" height="10" rx="1"/>
    <rect x="255" y="240" width="10" height="10" rx="1"/>

    <rect x="145" y="260" width="10" height="10" rx="1"/>
    <rect x="165" y="260" width="10" height="10" rx="1"/>
    <rect x="185" y="260" width="10" height="10" rx="1"/>
    <rect x="215" y="260" width="10" height="10" rx="1"/>
    <rect x="245" y="260" width="10" height="10" rx="1"/>

