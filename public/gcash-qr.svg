  <text x="170" y="59" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#bae6fd" text-anchor="middle" letter-spacing="0.5">SCAN TO PAY • FROSTTECH</text>

  <!-- QR Frame White Container -->
  <rect x="45" y="85" width="250" height="250" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- QR Code Position Detection Patterns (Top-Left, Top-Right, Bottom-Left) -->
