  <circle cx="170" cy="210" r="16" fill="#005ce6"/>
  <path d="M 164 210 L 168 214 L 176 206" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

