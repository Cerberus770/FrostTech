  <rect x="65" y="105" width="55" height="55" rx="6" fill="#005ce6"/>
  <rect x="73" y="113" width="39" height="39" rx="4" fill="#ffffff"/>
  <rect x="81" y="121" width="23" height="23" rx="2" fill="#005ce6"/>

